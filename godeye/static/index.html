<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGodEye</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e6e5e0;
    --green: #15803d; --green-bg: #dcfce7; --red: #9f1239; --red-bg: #ffe4e6;
    --amber: #92400e; --amber-bg: #fef3c7; --gray-bg: #efefec; --glow: rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1d1d1b; --text: #ecebe6; --muted: #9a9993; --line: #2c2c29;
      --green: #4ade80; --green-bg: #12321f; --red: #fda4af; --red-bg: #3a1720;
      --amber: #fcd34d; --amber-bg: #3a2c0d; --gray-bg: #2a2a27; --glow: rgba(255,255,255,.09);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 40px 20px 60px; }
  header { display: flex; align-items: center; gap: 28px; margin-bottom: 30px; }
  .hero { width: 120px; height: 170px; flex: none; position: relative; }
  .hero::before { content: ""; position: absolute; inset: 18% 8% 4%; border-radius: 50%;
                  background: radial-gradient(closest-side, var(--glow), transparent); }
  .hero img { position: relative; display: block; width: 120px; height: 170px; object-fit: contain;
              filter: drop-shadow(0 10px 14px rgba(0,0,0,.18)); }
  .hero.hidden { display: none; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 4px 0 14px; font-size: 28px; font-weight: 650; letter-spacing: -.01em; }
  .overall { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
             font-weight: 600; font-size: 14px; background: var(--gray-bg); }
  .overall.hot { background: var(--green-bg); color: var(--green); }
  .meta { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .toprow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
          padding: 2px 9px 2px 7px; border-radius: 999px; background: var(--gray-bg); color: var(--muted); }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .live.on { background: var(--green-bg); color: var(--green); }
  .live.on::before { animation: pulse 2s ease-in-out infinite; }
  .live.off { background: var(--red-bg); color: var(--red); }
  .live.stalled { background: var(--amber-bg); color: var(--amber); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .live.on::before { animation: none; } }
  .offline-note { display: none; margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px;
                  background: var(--red-bg); color: var(--red); }
  body.offline .offline-note { display: block; }
  body.offline .list { opacity: .45; pointer-events: none; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
         display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: start; }
  .row.hot { border-color: var(--green); box-shadow: 0 0 0 1px var(--green) inset; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .summary { color: var(--muted); font-size: 14px; grid-column: 1; }
  .err { color: var(--amber); font-size: 13px; grid-column: 1; }
  .chips { grid-column: 1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--gray-bg); color: var(--muted);
          text-decoration: none; }
  .chip.hot { background: var(--green-bg); color: var(--green); font-weight: 600; }
  .side { grid-column: 2; grid-row: 1 / span 4; text-align: right; display: flex; flex-direction: column;
          align-items: flex-end; gap: 8px; }
  .times { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .actions { display: flex; gap: 6px; }

  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--gray-bg);
           color: var(--muted); }
  .badge.in_stock, .badge.match { background: var(--green-bg); color: var(--green); }
  .badge.out_of_stock { background: var(--red-bg); color: var(--red); }
  .badge.error { background: var(--amber-bg); color: var(--amber); }

  a.btn, button.btn { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; }
  a.btn:hover, button.btn:hover { border-color: var(--muted); }
  button.btn[disabled] { opacity: .5; cursor: default; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  code { background: var(--gray-bg); padding: 1px 6px; border-radius: 5px; }

  @media (max-width: 560px) {
    .row { grid-template-columns: 1fr; }
    .side { grid-column: 1; grid-row: auto; align-items: flex-start; text-align: left; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="hero hidden" id="hero"><img id="heroimg" alt=""></div>
    <div>
      <div class="toprow"><span class="eyebrow">WebGodEye · watching</span>
        <span class="live" id="live">Connecting…</span></div>
      <h1 id="target">…</h1>
      <div id="overall" class="overall">Loading…</div>
      <div class="meta" id="meta"></div>
    </div>
  </header>
  <div class="offline-note">WebGodEye isn't running, so nothing is being checked. Double-click <b>run.bat</b> to
    start it. This page reconnects by itself. The results below are from before it stopped.</div>
  <div class="list" id="list"></div>
  <footer id="footer"></footer>
</main>

<script>
const LABEL = { in_stock: "In stock", out_of_stock: "Sold out", not_listed: "Not listed", match: "Mentioned",
                no_match: "No mention", manual: "Manual", pending: "Waiting", error: "Couldn't check" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ago(ts, now) {
  if (!ts) return "never";
  const s = Math.max(0, Math.round(now - ts));
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(ts * 1000).toLocaleString();
}
function until(ts, now) {
  if (!ts) return "";
  const s = Math.round(ts - now);
  if (s <= 0) return "next: now";
  return s < 3600 ? `next in ${Math.max(1, Math.round(s / 60))} min` : `next in ${Math.round(s / 3600)} h`;
}

function row(src, now) {
  const failing = src.error && src.consecutive_errors > 0;
  const status = src.checking ? "pending" : (failing && !src.last_ok ? "error" : src.status);
  const hot = ["in_stock", "match"].includes(src.status);
  const items = src.items.slice(0, 6);
  const chips = items.map(i => `<a class="chip ${i.hot ? "hot" : ""}" href="${esc(i.url)}" target="_blank" rel="noopener"
      title="${esc(i.title)}">${esc(i.title.length > 60 ? i.title.slice(0, 60) + "…" : i.title)}${i.note ? " · " + esc(i.note) : ""}</a>`).join("");
  return `<div class="row ${hot ? "hot" : ""}">
    <div class="name">${esc(src.name)} <span class="badge ${status}">${src.checking ? "Checking…" : LABEL[status] || status}</span></div>
    <div class="summary">${esc(failing && !src.last_ok ? "" : src.summary)}</div>
    ${failing ? `<div class="err">⚠ ${esc(src.error)}${src.last_ok ? ` · last good check ${ago(src.last_ok, now)}` : ""}</div>` : ""}
    ${chips ? `<div class="chips">${chips}</div>` : ""}
    <div class="side">
      <div class="times">${src.type === "link" ? "" : "checked " + ago(src.last_check, now)}<br>${src.type === "link" ? "" : until(src.next_check, now)}</div>
      <div class="actions">
        ${src.type === "link" ? "" : `<button class="btn" data-id="${esc(src.id)}" ${src.checking ? "disabled" : ""}>Check now</button>`}
        ${src.link ? `<a class="btn" href="${esc(src.link)}" target="_blank" rel="noopener">Open ↗</a>` : ""}
      </div>
    </div>
  </div>`;
}

// Live status: pill in the header + coloured dot as the tab icon (visible from Opera's tab bar).
const DOT = { on: "#22c55e", off: "#ef4444", stalled: "#f59e0b", hot: "#22c55e" };
let lastIcon = "";
function setLive(state, text, hot = false) {
  const el = document.getElementById("live");
  el.className = "live " + state;
  el.textContent = text;
  document.body.classList.toggle("offline", state === "off");
  const key = state + hot;
  if (key === lastIcon) return;
  lastIcon = key;
  const ring = hot ? `<circle cx="16" cy="16" r="14" fill="none" stroke="${DOT.hot}" stroke-width="3"/>` : "";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">${ring}<circle cx="16" cy="16" r="${hot ? 9 : 12}" fill="${DOT[state]}"/></svg>`;
  let link = document.querySelector("link[rel=icon]");
  if (!link) { link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
  link.href = "data:image/svg+xml," + encodeURIComponent(svg);
}

let timer;
function schedule(ms) { clearTimeout(timer); timer = setTimeout(refresh, ms); }

async function refresh() {
  let data;
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch {
    setLive("off", "Offline");
    document.title = "Offline · WebGodEye";
    schedule(5000);  // keep trying; reconnects as soon as run.bat is started
    return;
  }
  schedule(10000);

  const now = data.now;
  const hot = data.sources.filter(s => ["in_stock", "match"].includes(s.status));
  if (data.heartbeat_age == null || data.heartbeat_age > 120) setLive("stalled", "Checker stalled — restart run.bat", hot.length > 0);
  else setLive("on", "Running", hot.length > 0);
  document.getElementById("target").textContent = data.target;
  const img = document.getElementById("heroimg");
  if (data.image && img.getAttribute("src") !== data.image) {
    img.src = data.image; img.alt = data.target;
    img.onload = () => document.getElementById("hero").classList.remove("hidden");
  }
  const overall = document.getElementById("overall");
  overall.className = "overall" + (hot.length ? " hot" : "");
  overall.textContent = hot.length ? `● Found: ${hot.map(s => s.name).join(", ")}` : "Not in stock anywhere yet";
  document.title = (hot.length ? "● IN STOCK — " : "") + `${data.target} · WebGodEye`;
  const checked = data.sources.filter(s => s.last_check).map(s => s.last_check);
  document.getElementById("meta").textContent =
    `${data.sources.length} sources · last activity ${ago(checked.length ? Math.max(...checked) : null, now)}`;
  document.getElementById("list").innerHTML = data.sources.map(s => row(s, now)).join("");
  document.getElementById("footer").innerHTML = data.ntfy_topic
    ? `Phone alerts: install the ntfy app and subscribe to <code>${esc(data.ntfy_topic)}</code>` : "";
}

document.getElementById("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  b.disabled = true; b.textContent = "Queued…";
  await fetch(`/api/check/${encodeURIComponent(b.dataset.id)}`, { method: "POST" });
  setTimeout(refresh, 1500);
});

refresh();
</script>
</body>
</html>
